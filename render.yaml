services:
  - type: web
    name: lulc-mapping-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PROJECT_ID
        value: favorable-bolt-489809-c7
      - key: EARTHENGINE_TOKEN
        sync: false
